<header>
  <div class="container mx-auto flex items-center justify-between border-b border-primary">
    <app-logo />
    <app-search />
    <div class="flex items-center gap-5">
      <app-cart />
      <app-button [label]="'Login'" [color]="'primary'" [type]="'submit'" [icon]="'login'" [iconPosition]="'left'" />
    </div>
  </div>
</header>
<main>
  <section id="carousel">
    <div class="container mx-auto">
      <app-carousel />
    </div>
  </section>
  <section id="categories">
    <div class="container mx-auto flex items-start justify-between mt-4 gap-12">
      <aside>
        <div class="w-full bg-secondary px-4 py-3">
          <app-categories />
        </div>
        <app-promo-banner />
      </aside>
      <div class="w-full">
        <app-cards-blok />
      </div>
    </div>
  </section>
</main>
