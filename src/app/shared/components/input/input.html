@if (type() !== 'select') {
<div
  class="form-group flex items-center gap-2 border border-gray-300 rounded-md px-4 py-2 shadow-sm bg-white focus-within:ring-2 focus-within:ring-primary transition-all duration-300 w-full max-w-md"
>
  @if (type() === 'search') {
  <mat-icon class="text-gray-500">search</mat-icon>
  } @switch (type()) { @case ('text') {
  <input
    (input)="updateValue(inputRef.value)"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    #inputRef
    type="text"
    class="flex-1 outline-none bg-transparent text-sm text-gray-800 placeholder:text-gray-400"
  />
  } @case ('number') {
  <input
    (input)="updateValue(inputRef.value)"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    #inputRef
    type="number"
    class="flex-1 outline-none bg-transparent text-sm text-gray-800 placeholder:text-gray-400"
  />
  } @case ('search') {
  <input
    (input)="updateValue(inputRef.value)"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    #inputRef
    type="text"
    class="flex-1 outline-none bg-transparent text-sm text-gray-800 placeholder:text-gray-400"
  />
  } @case ('textarea') {
  <textarea
    (input)="updateValue(inputRef.value)"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    #inputRef
    class="flex-1 outline-none bg-transparent text-sm text-gray-800 placeholder:text-gray-400"
  >
{{ value() }}</textarea
  >
  } @default {
  <input
    (input)="updateValue(inputRef.value)"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    [type]="type()"
    #inputRef
    class="flex-1 outline-none bg-transparent text-sm text-gray-800 placeholder:text-gray-400"
  />
  } }
</div>
} @else {
<div class="form-group w-full max-w-md">
  <select
    (change)="updateValue(selectRef.value)"
    [disabled]="isDisabled()"
    #selectRef
    class="w-full px-3 py-2 text-sm text-gray-800 outline-none"
  >
    @for (option of options(); track option.value) {
    <option [value]="option.value" [selected]="option.value === value()">{{ option.label }}</option>
    }
  </select>
</div>
}
