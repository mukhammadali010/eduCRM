<div class="w-full mx-auto">
  <div class="relative h-[420px] overflow-hidden rounded-lg shadow-lg bg-gray-50">
    @for (slide of slides; track slide; let i = $index) {
      <div
        [class.opacity-100]="i === activeIndex()"
        [class.opacity-0]="i !== activeIndex()"
        [class.z-20]="i === activeIndex()"
        [class.z-10]="i !== activeIndex()"
        class="absolute inset-0 flex items-center justify-between transition-opacity duration-1000 ease-in-out"
      >
        <div class="w-full md:w-1/2 p-6 space-y-4 flex flex-col justify-center">
          <p class="uppercase text-sm tracking-widest text-gray-600">Welcome to TechZone</p>
          <h1 class="text-4xl font-bold leading-tight">
            {{ slide.title }}
            <span class="text-primary">{{ slide.highlight }}</span>
          </h1>
          <p class="text-gray-600">{{ slide.desc }}</p>
          <app-button [color]="'primary'" [label]="'Shop now'" />
        </div>

        <div class="w-full md:w-1/2 flex items-center justify-center">
          <img [src]="slide.image" class="w-full h-full object-cover rounded-r-lg" alt="Slide Image" />
        </div>
      </div>
    }
  </div>

  <div class="flex justify-center mt-4 space-x-2">
    @for (slide of slides; track slide; let i = $index) {
      <div
        (click)="setIndex(i)"
        (keydown.enter)="setIndex(i)"
        (keydown.space)="setIndex(i)"
        [attr.aria-label]="'Go to slide ' + (i + 1)"
        [class.bg-primary]="i === activeIndex()"
        [class.scale-125]="i === activeIndex()"
        [class.bg-gray-300]="i !== activeIndex()"
        role="button"
        tabindex="0"
        class="w-3 h-3 rounded-full cursor-pointer transition-all duration-300 outline-none"
      ></div>
    }
  </div>
</div>
