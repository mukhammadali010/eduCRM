<div class="flex flex-col gap-5">
  <div>
    <h4>Categories</h4>
    <ul class="ml-3">
      @for(category of categories; track category; let i = $index){
      <li class="flex items-center justify-between w-full hover:text-primary cursor-pointer mt-2">
        <span>{{category.name}}</span> <span>({{category.count}})</span>
      </li>
      }
    </ul>
  </div>
  <div>
    <h4>Price Range</h4>
    <div class="ml-3">
      <mat-slider [min]="min()" [max]="max()" step="10">
        <input (input)="updateStart($event)" [value]="startPrice()" matSliderStartThumb />
        <input (input)="updateEnd($event)" [value]="endPrice()" matSliderEndThumb />
      </mat-slider>
      <p>Price: <span>{{ startPrice() }}$ - {{ endPrice() }}$</span></p>
      <app-button [bgcolor]="'bg-primary'" [label]="'Filter'" />
    </div>
  </div>
</div>
