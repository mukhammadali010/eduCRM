<button
  (click)="buttonClick.emit()"
  [disabled]="disabled()"
  [type]="type()"
  [class]="bgcolor() + ' ' + textcolor() + ' ' + width()"
  class="flex items-center border border-secondary-400 cursor-pointer justify-center gap-2 px-4 py-2 text-base rounded-sm focus:outline-none focus:ring-2 focus-within:ring-primary-500 focus:ring-offset-2 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
>
  @if (icon() && iconPosition() === 'left') {
  <mat-icon>{{ icon() }}</mat-icon>
  {{ label() }} } @else if (icon() && iconPosition() === 'right') { {{ label() }}
  <mat-icon>{{ icon() }}</mat-icon>
  } @else if (!label() && !icon()) {
  <ng-content></ng-content>
  } @else { {{ label() }} }
</button>
